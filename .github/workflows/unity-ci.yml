name: Unity CI

on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]

# Stop previous runs for same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Limit GITHUB_TOKEN permissions to only what's needed
permissions:
  contents: read

jobs:
  # Check for .meta file consistency
  check-meta-files:
    name: Check .meta Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for .meta Files
        run: |
          echo "Checking for missing .meta files..."

          # Find all files and directories (excluding .git, Library, Temp, etc.)
          missing_meta=0

          # Check Assets folder
          if [ -d "Assets" ]; then
            while IFS= read -r -d '' file; do
              # Skip if it's a .meta file itself
              if [[ "$file" == *.meta ]]; then
                continue
              fi

              # Skip the Assets directory itself
              if [[ "$file" == "Assets" ]]; then
                continue
              fi

              # Check if corresponding .meta file exists
              if [ ! -f "$file.meta" ]; then
                echo "ERROR: Missing .meta file for: $file"
                missing_meta=$((missing_meta + 1))
              fi
            done < <(find Assets -type f -o -type d | grep -v "\.meta$" | tr '\n' '\0')
          fi

          # Check ProjectSettings folder for files only
          if [ -d "ProjectSettings" ]; then
            while IFS= read -r -d '' file; do
              if [[ "$file" == *.meta ]]; then
                continue
              fi

              if [ ! -f "$file.meta" ]; then
                echo "ERROR: Missing .meta file for: $file"
                missing_meta=$((missing_meta + 1))
              fi
            done < <(find ProjectSettings -type f | grep -v "\.meta$" | tr '\n' '\0')
          fi

          if [ $missing_meta -gt 0 ]; then
            echo "Found $missing_meta missing .meta file(s)"
            exit 1
          fi

          echo "All .meta files present!"

      - name: Check for Orphaned .meta Files
        run: |
          echo "Checking for orphaned .meta files..."

          orphaned_meta=0

          # Check Assets folder
          if [ -d "Assets" ]; then
            while IFS= read -r -d '' metafile; do
              original="${metafile%.meta}"

              if [ ! -e "$original" ]; then
                echo "ERROR: Orphaned .meta file (original missing): $metafile"
                orphaned_meta=$((orphaned_meta + 1))
              fi
            done < <(find Assets -name "*.meta" -type f | tr '\n' '\0')
          fi

          # Check ProjectSettings folder
          if [ -d "ProjectSettings" ]; then
            while IFS= read -r -d '' metafile; do
              original="${metafile%.meta}"

              if [ ! -e "$original" ]; then
                echo "ERROR: Orphaned .meta file (original missing): $metafile"
                orphaned_meta=$((orphaned_meta + 1))
              fi
            done < <(find ProjectSettings -name "*.meta" -type f | tr '\n' '\0')
          fi

          if [ $orphaned_meta -gt 0 ]; then
            echo "Found $orphaned_meta orphaned .meta file(s)"
            exit 1
          fi

          echo "No orphaned .meta files found!"

  # Test the Unity project
  test:
    name: Run Unity Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.7f1
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Test Results

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test Results
          path: artifacts

  # Build the Unity project
  build:
    name: Build Unity Project
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneLinux64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.7f1
          targetPlatform: ${{ matrix.targetPlatform }}

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
